<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>WebAR Avatar</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: 'Syne', sans-serif; }

    /* ── Pantalla de inicio ── */
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      background: linear-gradient(145deg, #0a0a0a 0%, #111 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 24px;
      transition: opacity 0.6s ease;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }

    .splash-icon {
      width: 80px; height: 80px;
      border: 3px solid #f5c518;
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 36px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(245,197,24,0.4); }
      50% { box-shadow: 0 0 0 16px rgba(245,197,24,0); }
    }

    #splash h1 {
      color: #fff; font-size: 22px; font-weight: 800;
      letter-spacing: 2px; text-align: center; line-height: 1.3;
    }
    #splash p {
      color: #888; font-size: 13px; text-align: center;
      max-width: 260px; line-height: 1.6; font-family: sans-serif;
    }

    #startBtn {
      background: #f5c518; color: #000;
      border: none; border-radius: 50px;
      padding: 14px 36px; font-size: 15px;
      font-weight: 800; font-family: 'Syne', sans-serif;
      letter-spacing: 1px; cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    #startBtn:active { transform: scale(0.96); }

    /* ── HUD superior ── */
    #hud-top {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 100; padding: 16px 20px;
      display: flex; align-items: center; justify-content: space-between;
      background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 100%);
      display: none;
    }
    #hud-top .logo {
      color: #f5c518; font-size: 13px; font-weight: 800;
      letter-spacing: 3px; text-transform: uppercase;
    }
    #status-badge {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50px; padding: 5px 14px;
      color: #fff; font-size: 11px; font-family: sans-serif;
      display: flex; align-items: center; gap: 6px;
    }
    #status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #ff4444;
      transition: background 0.3s;
    }
    #status-dot.active { background: #44ff88; }

    /* ── Mensaje de apuntar ── */
    #scan-hint {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 100; text-align: center;
      transition: opacity 0.4s;
    }
    #scan-hint .frame {
      width: 220px; height: 220px; margin: 0 auto 16px;
      border: 2px solid rgba(245,197,24,0.6);
      border-radius: 20px; position: relative;
      animation: scanPulse 2s ease-in-out infinite;
    }
    #scan-hint .frame::before,
    #scan-hint .frame::after {
      content: '';
      position: absolute; width: 24px; height: 24px;
      border-color: #f5c518; border-style: solid;
    }
    #scan-hint .frame::before {
      top: -2px; left: -2px;
      border-width: 3px 0 0 3px; border-radius: 8px 0 0 0;
    }
    #scan-hint .frame::after {
      bottom: -2px; right: -2px;
      border-width: 0 3px 3px 0; border-radius: 0 0 8px 0;
    }
    @keyframes scanPulse {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.03); }
    }
    #scan-hint p {
      color: rgba(255,255,255,0.8); font-size: 13px;
      font-family: sans-serif; letter-spacing: 1px;
    }
    #scan-hint.hidden { opacity: 0; pointer-events: none; }

    /* ── Panel de controles ── */
    #controls {
      position: fixed; bottom: 0; left: 0; right: 0;
      z-index: 100; padding: 16px 20px 32px;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 100%);
      display: none; /* Se muestra con JS */
      opacity: 0;
      transition: opacity 0.4s;
    }
    #controls.visible { opacity: 1; }

    .controls-label {
      color: rgba(255,255,255,0.4); font-size: 10px;
      letter-spacing: 3px; text-align: center;
      margin-bottom: 14px; font-family: sans-serif;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      max-width: 340px;
      margin: 0 auto;
    }

    /* Botones de acción */
    .ctrl-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 14px;
      color: #fff;
      font-size: 20px;
      padding: 0;
      height: 58px;
      cursor: pointer;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 2px;
      transition: background 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .ctrl-btn span.label {
      font-size: 8px; color: rgba(255,255,255,0.4);
      font-family: sans-serif; letter-spacing: 1px;
    }
    .ctrl-btn:active {
      background: rgba(245,197,24,0.2);
      border-color: #f5c518;
      transform: scale(0.93);
    }
    .ctrl-btn.accent {
      background: rgba(245,197,24,0.15);
      border-color: rgba(245,197,24,0.4);
    }

    /* Reset ocupa 2 columnas */
    .ctrl-btn.wide {
      grid-column: span 2;
    }

    /* ── Spinner de carga ── */
    #loader {
      position: fixed; inset: 0; z-index: 9998;
      background: #000;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      display: none;
    }
    .spinner {
      width: 44px; height: 44px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #f5c518;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loader p { color: #666; font-size: 12px; font-family: sans-serif; letter-spacing: 2px; }
  </style>
</head>
<body>

  <!-- Pantalla de inicio -->
  <div id="splash">
    <div class="splash-icon">🏠</div>
    <h1>LOMA DE JESÚS<br>EXPERIENCIA AR</h1>
    <p>Apunta tu cámara al poster para ver el modelo en realidad aumentada</p>
    <button id="startBtn" onclick="iniciarAR()">INICIAR AR</button>
  </div>

  <!-- Loader -->
  <div id="loader">
    <div class="spinner"></div>
    <p>INICIANDO CÁMARA...</p>
  </div>

  <!-- HUD superior -->
  <div id="hud-top">
    <div class="logo">AR · LOMA</div>
    <div id="status-badge">
      <div id="status-dot"></div>
      <span id="status-text">Buscando poster...</span>
    </div>
  </div>

  <!-- Hint de escaneo -->
  <div id="scan-hint">
    <div class="frame"></div>
    <p>APUNTA AL POSTER</p>
  </div>

  <!-- Controles flotantes -->
  <div id="controls">
    <div class="controls-label">CONTROLES</div>
    <div class="btn-grid">

      <!-- Fila 1: Escala + Rotación -->
      <button class="ctrl-btn accent" ontouchstart="iniciarAccion('escalar', 0.08)" ontouchend="detenerAccion()" onmousedown="iniciarAccion('escalar', 0.08)" onmouseup="detenerAccion()">
        ➕<span class="label">GRANDE</span>
      </button>
      <button class="ctrl-btn accent" ontouchstart="iniciarAccion('escalar', -0.08)" ontouchend="detenerAccion()" onmousedown="iniciarAccion('escalar', -0.08)" onmouseup="detenerAccion()">
        ➖<span class="label">PEQUEÑO</span>
      </button>
      <button class="ctrl-btn" ontouchstart="iniciarAccion('rotar', -3)" ontouchend="detenerAccion()" onmousedown="iniciarAccion('rotar', -3)" onmouseup="detenerAccion()">
        🔄<span class="label">IZQ</span>
      </button>
      <button class="ctrl-btn" ontouchstart="iniciarAccion('rotar', 3)" ontouchend="detenerAccion()" onmousedown="iniciarAccion('rotar', 3)" onmouseup="detenerAccion()">
        🔃<span class="label">DER</span>
      </button>

      <!-- Fila 2: Movimiento -->
      <button class="ctrl-btn" ontouchstart="iniciarAccion('mover', [-0.08, 0])" ontouchend="detenerAccion()" onmousedown="iniciarAccion('mover', [-0.08, 0])" onmouseup="detenerAccion()">
        ⬅️<span class="label">IZQ</span>
      </button>
      <button class="ctrl-btn" ontouchstart="iniciarAccion('mover', [0.08, 0])" ontouchend="detenerAccion()" onmousedown="iniciarAccion('mover', [0.08, 0])" onmouseup="detenerAccion()">
        ➡️<span class="label">DER</span>
      </button>
      <button class="ctrl-btn" ontouchstart="iniciarAccion('mover', [0, 0.08])" ontouchend="detenerAccion()" onmousedown="iniciarAccion('mover', [0, 0.08])" onmouseup="detenerAccion()">
        ⬆️<span class="label">ARRIBA</span>
      </button>
      <button class="ctrl-btn" ontouchstart="iniciarAccion('mover', [0, -0.08])" ontouchend="detenerAccion()" onmousedown="iniciarAccion('mover', [0, -0.08])" onmouseup="detenerAccion()">
        ⬇️<span class="label">ABAJO</span>
      </button>

      <!-- Fila 3: Profundidad + Reset -->
      <button class="ctrl-btn" ontouchstart="iniciarAccion('profundidad', 0.08)" ontouchend="detenerAccion()" onmousedown="iniciarAccion('profundidad', 0.08)" onmouseup="detenerAccion()">
        🔼<span class="label">FRENTE</span>
      </button>
      <button class="ctrl-btn" ontouchstart="iniciarAccion('profundidad', -0.08)" ontouchend="detenerAccion()" onmousedown="iniciarAccion('profundidad', -0.08)" onmouseup="detenerAccion()">
        🔽<span class="label">ATRÁS</span>
      </button>
      <button class="ctrl-btn wide accent" onclick="resetAvatar()">
        ↺<span class="label">RESETEAR TODO</span>
      </button>

    </div>
  </div>

  <!-- Escena AR -->
  <a-scene
    id="arScene"
    mindar-image="imageTargetSrc: targets.mind;
                  filterMinCF: 0.001;
                  filterBeta: 0.01;
                  missTolerance: 5;
                  warmupTolerance: 5;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    style="display:none;">

    <a-assets>
      <a-asset-item id="avatar" src="avatar.glb"></a-asset-item>
      <!-- Cambia "video.mp4" por el nombre de tu archivo de video -->
      <video
        id="miVideo"
        src="video.mp4"
        preload="auto"
        loop
        muted
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <!-- Luces -->
      <a-light type="ambient" color="#fff" intensity="0.8"></a-light>
      <a-light type="directional" color="#fff" intensity="1.2" position="1 2 1"></a-light>

      <!-- Avatar (desplazado a la izquierda) -->
      <a-gltf-model
        id="miAvatar"
        src="#avatar"
        position="-0.4 0 0.1"
        scale="0.5 0.5 0.5"
        rotation="0 0 0"
        animation-mixer>
      </a-gltf-model>

      <!-- Marco del video (fondo oscuro redondeado) -->
      <a-plane
        id="videoMarco"
        position="0.55 0.05 0.05"
        width="0.72"
        height="0.46"
        color="#0a0a0a"
        opacity="0.9">
      </a-plane>

      <!-- Borde dorado del marco -->
      <a-plane
        position="0.55 0.05 0.04"
        width="0.76"
        height="0.50"
        color="#f5c518"
        opacity="0.9">
      </a-plane>

      <!-- Panel de video -->
      <a-video
        id="panelVideo"
        src="#miVideo"
        position="0.55 0.05 0.06"
        width="0.68"
        height="0.42">
      </a-video>

      <!-- Etiqueta "EN VIVO / PROMO" encima del video -->
      <a-plane
        position="0.55 0.30 0.07"
        width="0.28" height="0.07"
        color="#f5c518">
        <a-text
          value="▶ PROMO"
          align="center"
          color="#000"
          width="1.2"
          position="0 0 0.01"
          font="https://cdn.aframe.io/fonts/Exo2Bold.fnt">
        </a-text>
      </a-plane>

    </a-entity>

  </a-scene>

  <script>
    // ── Estado del avatar ──
    const DEFAULT = { px: 0, py: 0, pz: 0.1, scale: 0.5, ry: 0 };
    let accionInterval = null;

    function iniciarAR() {
      document.getElementById('splash').classList.add('hidden');
      document.getElementById('loader').style.display = 'flex';

      setTimeout(() => {
        document.getElementById('loader').style.display = 'none';
        document.getElementById('arScene').style.display = 'block';
        document.getElementById('hud-top').style.display = 'flex';
        document.getElementById('scan-hint').style.display = 'block';
        document.getElementById('controls').style.display = 'block';
        registrarEventos();
      }, 800);
    }

    function registrarEventos() {
      const target = document.getElementById('target');
      const dot = document.getElementById('status-dot');
      const statusText = document.getElementById('status-text');
      const hint = document.getElementById('scan-hint');
      const controls = document.getElementById('controls');

      const video = document.getElementById('miVideo');

      target.addEventListener('targetFound', () => {
        dot.classList.add('active');
        statusText.textContent = 'Poster detectado ✓';
        hint.classList.add('hidden');
        controls.classList.add('visible');
        // Reproduce el video al detectar el poster
        video.play().catch(e => console.warn('Autoplay bloqueado:', e));
      });

      target.addEventListener('targetLost', () => {
        dot.classList.remove('active');
        statusText.textContent = 'Buscando poster...';
        hint.classList.remove('hidden');
        controls.classList.remove('visible');
        // Pausa el video cuando pierde el poster
        video.pause();
      });
    }

    // ── Acciones continuas (mientras se mantiene presionado) ──
    function iniciarAccion(tipo, valor) {
      ejecutarAccion(tipo, valor);
      accionInterval = setInterval(() => ejecutarAccion(tipo, valor), 80);
    }

    function detenerAccion() {
      clearInterval(accionInterval);
      accionInterval = null;
    }

    function ejecutarAccion(tipo, valor) {
      const avatar = document.getElementById('miAvatar');
      if (!avatar) return;
      const obj = avatar.object3D;

      if (tipo === 'escalar') {
        const nuevo = Math.max(0.05, Math.min(3, obj.scale.x + valor));
        obj.scale.set(nuevo, nuevo, nuevo);

      } else if (tipo === 'rotar') {
        obj.rotation.y += valor * (Math.PI / 180);

      } else if (tipo === 'mover') {
        obj.position.x += valor[0];
        obj.position.y += valor[1];

      } else if (tipo === 'profundidad') {
        obj.position.z += valor;
      }
    }

    function resetAvatar() {
      const avatar = document.getElementById('miAvatar');
      if (!avatar) return;
      const obj = avatar.object3D;
      obj.position.set(DEFAULT.px, DEFAULT.py, DEFAULT.pz);
      obj.scale.set(DEFAULT.scale, DEFAULT.scale, DEFAULT.scale);
      obj.rotation.set(0, DEFAULT.ry, 0);
    }
  </script>
</body>
</html>
